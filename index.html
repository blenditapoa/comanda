<style>

<script>
// ============================================================
//  COMANDA CENTRAL v2.1
//  - Persistência tripla: memória + localStorage + Google Sheets
//  - Sync por MESCLAGEM (nunca sobrescreve/perde registros)
//  - Datas normalizadas (corrige fuso e formatos quebrados)
//  - Balanço completo: dia/semana/mês, pagamentos, motoboy,
//    fiado, voucher, diferença de caixa, melhores dias
//  NOVO na 2.1:
//  - Retirada do caixa (aba própria, entra no fechamento)
//  - Balanço do troco com destino do movimento
//  - Motoboy dinheiro + PIX lado a lado
//  - Metas e ponto de equilíbrio
//  - Chave de acesso (a URL sozinha não abre mais os dados)
// ============================================================
const APP_VERSION = '2.1';
let SHEET_URL = localStorage.getItem('sheetUrl') || 'https://script.google.com/macros/s/AKfycbyX44cbwOp7d5ksMQekI_5W_z_fxHf9ZLN3gygKCxctFONFQP0ikgvx3s9cZ0k9qzwgfQ/exec';

// ------------------------------------------------------------
//  CHAVE DE ACESSO
//  Este arquivo é PÚBLICO no GitHub Pages — a URL acima está à
//  vista de qualquer um. A chave secreta NUNCA fica aqui: ela é
//  colada uma vez em cada aparelho autorizado e guardada só no
//  navegador daquele aparelho. Sem ela o backend recusa tudo.
// ------------------------------------------------------------
let ACCESS_KEY = '';
try { ACCESS_KEY = localStorage.getItem('ccChave') || ''; } catch(e) {}
function urlK(base){ return base + (base.indexOf('?')>-1?'&':'?') + 'k=' + encodeURIComponent(ACCESS_KEY); }
let precisaChave = false;    // backend recusou por chave inválida
let apiDesprotegida = false; // backend está sem chave configurada
function pedirChave(){
  toast('🔐 O servidor recusou a chave deste aparelho', true);
  if (confirm('A chave de acesso guardada neste aparelho não foi aceita pelo servidor.\n\n' +
      'Isso acontece quando uma chave nova foi gerada na planilha.\n\n' +
      'Refazer o cadastro deste aparelho agora? Você vai precisar da chave de acesso atual.\n' +
      'Os dados no Google Sheets não são afetados.')) {
    try{ localStorage.removeItem('ccAuth'); }catch(e){}
    sair();
  }
}


// ============================================================
//  LOGIN, CRIPTOGRAFIA E BLOQUEIO
//
//  Como funciona (e por que é assim):
//  Este arquivo é público no GitHub. Senha escrita no código não
//  protege nada. Aqui a senha DERIVA uma chave (PBKDF2, 250 mil
//  iterações) que CIFRA a chave de acesso e o cache local
//  (AES-GCM). Sem a senha certa o aparelho não tem chave
//  utilizável e os dados guardados nele ficam ilegíveis — mesmo
//  para quem abrir o console do navegador.
// ============================================================
const CRY = {
  enc: new TextEncoder(), dec: new TextDecoder(),
  b64(buf){
    const b = new Uint8Array(buf); let s = '';
    for (let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i,i+0x8000));
    return btoa(s);
  },
  ub64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); },
  novoSalt(){ return CRY.b64(crypto.getRandomValues(new Uint8Array(16))); },
  async derivar(senha, saltB64){
    const base = await crypto.subtle.importKey('raw', CRY.enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: CRY.ub64(saltB64), iterations: 250000, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  },
  async cifrar(texto, key){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, CRY.enc.encode(texto));
    return { iv: CRY.b64(iv), ct: CRY.b64(ct) };
  },
  // devolve null se a senha estiver errada (o AES-GCM detecta pela tag de autenticação)
  async decifrar(blob, key){
    try{
      const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: CRY.ub64(blob.iv) }, key, CRY.ub64(blob.ct));
      return CRY.dec.decode(pt);
    }catch(e){ return null; }
  }
};

// ---------- usuários deste aparelho ----------
// { v:1, usuarios:[{id, nome, salt, cofre:{iv,ct}}] }   cofre = chave de acesso cifrada
function authLer(){ try{ return JSON.parse(localStorage.getItem('ccAuth')||'null'); }catch(e){ return null; } }
function authGravar(o){ try{ localStorage.setItem('ccAuth', JSON.stringify(o)); }catch(e){} }
function authUsuarios(){ const a = authLer(); return (a && Array.isArray(a.usuarios)) ? a.usuarios : []; }

let SESSAO = { id:null, nome:null, key:null };
const LOGADO = () => !!SESSAO.key;

async function criarUsuario(nome, senha, chaveAcesso){
  const salt = CRY.novoSalt();
  const key = await CRY.derivar(senha, salt);
  const cofre = await CRY.cifrar(chaveAcesso, key);
  const a = authLer() || { v:1, usuarios:[] };
  const id = nome.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20) || ('u'+Date.now());
  a.usuarios = a.usuarios.filter(u=>u.id!==id);
  a.usuarios.push({ id, nome, salt, cofre });
  authGravar(a);
  return { id, nome, key };
}

async function entrar(id, senha){
  const u = authUsuarios().find(x=>x.id===id);
  if (!u) return { ok:false, erro:'Usuário não encontrado neste aparelho.' };
  const key = await CRY.derivar(senha, u.salt);
  const chave = await CRY.decifrar(u.cofre, key);
  if (chave === null) return { ok:false, erro:'Senha incorreta.' };
  SESSAO = { id:u.id, nome:u.nome, key };
  ACCESS_KEY = chave;
  return { ok:true };
}

function sair(){
  SESSAO = { id:null, nome:null, key:null };
  ACCESS_KEY = '';
  S = { fechamentos:[], retiradas:[], config:[], produtos:[], insumos:[], fornecedores:[], clientes:[] };
  clearTimeout(_travaTimer);
  mostrarTrava();
}

// ---------- bloqueio por inatividade ----------
let _travaTimer = null;
function minutosTrava(){ const n = +localStorage.getItem('ccTrava'); return isNaN(n) ? 30 : n; }
function armarTrava(){
  clearTimeout(_travaTimer);
  const min = minutosTrava();
  if (min <= 0 || !LOGADO()) return;
  _travaTimer = setTimeout(()=>{ toast('Sessão bloqueada por inatividade'); sair(); }, min*60000);
}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, ()=>{ if(LOGADO()) armarTrava(); }, {passive:true}));

// ---------- tela de bloqueio ----------
function mostrarTrava(){
  const users = authUsuarios();
  const box = document.getElementById('lockscreen');
  box.style.display = 'grid';
  box.innerHTML = users.length ? `
    <div class="lockbox">
      <div class="lockmark">🍔</div>
      <h2>Comanda Central</h2>
      <p class="mini">Acesso restrito. Escolha o usuário e digite a senha.</p>
      <div class="lockusers">

// ============================================================
//  DATAS — normalização definitiva
//  Aceita: 'YYYY-MM-DD', ISO com hora (vindo do Sheets),
//  'DD/MM/YYYY', objetos Date. Datas inválidas (ex: 1899) => ''
// ============================================================
function normData(d){
  if (d === null || d === undefined || d === 0 || d === '') return '';
  if (d instanceof Date) d = d.toISOString();
  const s = String(d).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) { if (+m[1] < 2020 || +m[1] > 2100) return ''; return m[1]+'-'+m[2]+'-'+m[3]; }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) { if (+m[3] < 2020 || +m[3] > 2100) return ''; return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'); }
  return '';
}
// Data de HOJE no fuso local (o bug antigo usava UTC: depois das 21h
// o fechamento caía no dia seguinte)
function hojeStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtData(d){
  const n = normData(d);
  if (!n) return '—';
  return n.slice(5).split('-').reverse().join('/');
}
function fmtDataFull(d){ return normData(d); }
function fmtDataBR(d){
  const n = normData(d);
  if (!n) return '—';
  return n.split('-').reverse().join('/');
}
const DIAS_SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function weekdayOf(dstr){ const n=normData(dstr); if(!n) return -1; return new Date(n+'T12:00:00').getDay(); }
function round2(n){ return Math.round((+n||0)*100)/100; }

// Normaliza um fechamento vindo do Sheets (0s viram '', data normalizada)
function normFech(f){
  if (!f || typeof f !== 'object') return f;
  const out = {...f};
  out.data = normData(f.data);
  out.caixa = (f.caixa === 0 || f.caixa == null) ? '' : String(f.caixa);
  out.obs = (f.obs === 0 || f.obs == null) ? '' : String(f.obs);
  out.totalVendas = +f.totalVendas || 0;
  ['trocoInicio','trocoFinal','motoboyRepasse','motoboyPix'].forEach(k=> out[k] = +f[k] || 0);
  // campos da v2.1 — preservados sem alterar registros antigos
  out.versaoCalculo = +f.versaoCalculo || 0;
  out.destinoTroco = (f.destinoTroco === 0 || f.destinoTroco == null) ? '' : String(f.destinoTroco);
  out.obsTrocoInicio = (f.obsTrocoInicio === 0 || f.obsTrocoInicio == null) ? '' : String(f.obsTrocoInicio);
  out.obsTrocoFinal = (f.obsTrocoFinal === 0 || f.obsTrocoFinal == null) ? '' : String(f.obsTrocoFinal);
  const c = {}; CONF_CAMPOS.forEach(cc=> c[cc.id] = +((f.conf||{})[cc.id]) || 0);
  out.conf = c;
  out.saidas = Array.isArray(f.saidas) ? f.saidas : [];
  out.vendas = Array.isArray(f.vendas) ? f.vendas : [];
  return out;
}
function normRetirada(r){
  if (!r || typeof r !== 'object') return r;
  return {...r, data: normData(r.data), valor: +r.valor || 0,
    obs: (r.obs === 0 || r.obs == null) ? '' : String(r.obs),
    operador: (r.operador === 0 || r.operador == null) ? '' : String(r.operador)};
}
function isRegistroReal(x){ return x && typeof x.id === 'string' && x.id.length > 0; }

let syncStatus = 'none';
function setSyncStatus(s, msg) {
  syncStatus = s;
  const dot = document.getElementById('sdot');
  const lbl = document.getElementById('slabel');
  if (!dot) return;
  dot.className = 'sdot ' + (s==='ok'?'ok':s==='err'?'err':s==='loading'?'spin':'');
  lbl.textContent = msg || (s==='ok'?'Sincronizado':s==='err'?'Erro sync':s==='loading'?'Sincronizando...':'Offline');
}
function hora(){ return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

// Mescla: registros do Sheets + registros locais que ainda não subiram.
// NUNCA descarta um registro local só porque o Sheets não o tem.
function mergeColl(local, remote){
  const map = new Map();
  remote.forEach(r=>{ if (isRegistroReal(r)) map.set(r.id, r); });
  const extras = [];
  (local||[]).forEach(l=>{ if (isRegistroReal(l) && !map.has(l.id)) extras.push(l); });
  return { merged: [...map.values(), ...extras], extras: extras.length };
}

async function sheetLoad() {
  if (!SHEET_URL) return false;
  setSyncStatus('loading');
  try {
    const r = await fetch(urlK(SHEET_URL + '?action=load'), { redirect: 'follow' });
    const j = await r.json();
    if (!j.ok && j.error === 'CHAVE_INVALIDA') {
      precisaChave = true;
      setSyncStatus('err', 'Chave de acesso necessária');
      pedirChave();
      return false;
    }
    if (j.ok && j.data) {
      precisaChave = false;
      apiDesprotegida = !!j.semChave;
      const del = getDeleted();
      let pendentes = 0;
      KEYS.forEach(k => {
        let remote = (j.data[k]||[]);
        if (k === 'fechamentos') remote = remote.map(normFech);
        if (k === 'retiradas')   remote = remote.map(normRetirada);
        remote = remote.filter(x => isRegistroReal(x) && !del.has(x.id));
        const local = (S[k]||[]).filter(x => isRegistroReal(x) && !del.has(x.id));
        const { merged, extras } = mergeColl(local, remote);
        S[k] = merged; pendentes += extras;
      });
      await lsSave();
      setSyncStatus('ok', 'Atualizado ' + hora());
      if (pendentes > 0) {
        // Há registros locais que não estão no Sheets — reenvia
        setSyncStatus('loading', 'Enviando ' + pendentes + ' pendente(s)...');
        sheetSave();
      }
      return true;
    } else { setSyncStatus('err', 'Erro: ' + (j.error||'?')); return false; }
  } catch(e) { setSyncStatus('err', 'Sem conexão — usando dados locais'); return false; }
}

let _saveRetries = 0, _verifyTimer = null;
async function sheetSave() {
  // 1) SEMPRE salva local primeiro — o dado nunca se perde
  await lsSave(); await lsSnapshot();
  if (!SHEET_URL) return;
  if (precisaChave) { setSyncStatus('err', 'Chave necessária — salvo no dispositivo'); return; }
  setSyncStatus('loading', 'Salvando...');
  try {
    await fetch(SHEET_URL, { method:'POST', mode:'no-cors', body: JSON.stringify(Object.assign({ _k: ACCESS_KEY }, S)) });
    clearTimeout(_verifyTimer);
    _verifyTimer = setTimeout(verifySave, 3500);
  } catch(e) {
    setSyncStatus('err', 'Sem conexão — salvo no dispositivo');
    scheduleRetry();
  }
}
// 2) Confirma que o Sheets realmente gravou; se não, reenvia sozinho
async function verifySave(){
  try{
    const r = await fetch(urlK(SHEET_URL + '?action=load'), { redirect:'follow' });
    const j = await r.json();
    if (!j.ok && j.error === 'CHAVE_INVALIDA') {
      precisaChave = true;
      setSyncStatus('err', 'Chave inválida — dados seguros no dispositivo');
      return;
    }
    const remoteIds = new Set(((j.data&&j.data.fechamentos)||[]).map(x=>x.id));
    const faltando = (S.fechamentos||[]).filter(f => isRegistroReal(f) && !remoteIds.has(f.id));
    if (faltando.length === 0) {
      _saveRetries = 0;
      setSyncStatus('ok', 'Salvo e confirmado ' + hora());
    } else if (_saveRetries < 4) {
      _saveRetries++;
      setSyncStatus('loading', 'Confirmando... tentativa ' + _saveRetries);
      await fetch(SHEET_URL, { method:'POST', mode:'no-cors', body: JSON.stringify(Object.assign({ _k: ACCESS_KEY }, S)) });
      clearTimeout(_verifyTimer);
      _verifyTimer = setTimeout(verifySave, 4500);
    } else {
      _saveRetries = 0;
      setSyncStatus('err', '⚠️ Sheets não confirmou — dados seguros no dispositivo');
    }
  }catch(e){ setSyncStatus('err', 'Sem conexão — salvo no dispositivo'); scheduleRetry(); }
}
let _retryTimer = null;
function scheduleRetry(){
  clearTimeout(_retryTimer);
  _retryTimer = setTimeout(()=>{ if (navigator.onLine !== false) sheetSave(); }, 30000);
}

function custoProd(p) { return (p.ficha||[]).reduce((a,[iid,q])=>{const i=insumo(iid);return a+(i?i.custo*q:0);}, 0); }
function cmvFech(f) { return (f.vendas||[]).reduce((a,v)=>{const p=produto(v.pid);return a+(p?custoProd(p)*v.qtd:0);}, 0); }
function fatF(f) { return +f.totalVendas||0; }

// ============================================================
//  MOTOR DE CONFERÊNCIA DE CAIXA
// ============================================================
// Retiradas de uma data (aba própria) + saídas legadas gravadas no fechamento
function retiradasDoDia(data) {
  const d = normData(data);
  if (!d) return [];
  return (S.retiradas||[]).filter(r => normData(r.data) === d);
}
function totalRetiradasDoDia(data) { return round2(retiradasDoDia(data).reduce((a,r)=>a+(+r.valor||0), 0)); }
function totalSaidasLegado(f) { return round2(((f && f.saidas) || []).reduce((a,s)=>a+(+s.valor||0), 0)); }

// REGRA v2 — validada contra os 39 fechamentos manuais reais da planilha
//
//   Total conferido = recebimentos + retiradas do caixa
//                   + motoboy em dinheiro + (troco final − troco início)
//   Diferença       = Total conferido − Total de vendas
//                     negativo = FALTA   |   positivo = SOBRA
//
// A variação do troco entra com sinal natural:
//   • troco DIMINUIU → esse dinheiro NÃO veio de venda (cobriu motoboy ou
//     retirada, que já estão somados acima) → subtrai, senão conta 2x
//   • troco AUMENTOU → dinheiro de venda ficou na gaveta como troco → soma
//
// IMPORTANTE: "Dinheiro em mãos" é o valor LÍQUIDO, depois de pagar o
// motoboy e depois de deixar o troco certo.
function calcFechamento({soma, total, retiradas, motoboyDinheiro, trocoInicio, trocoFinal}) {
  soma = +soma||0; total = +total||0; retiradas = +retiradas||0;
  motoboyDinheiro = +motoboyDinheiro||0;
  trocoInicio = +trocoInicio||0; trocoFinal = +trocoFinal||0;

  const trocoDelta   = round2(trocoFinal - trocoInicio);
  const trocoUsado   = Math.max(0, -trocoDelta);
  const trocoReforco = Math.max(0,  trocoDelta);

  const somaAjustada = round2(soma + retiradas + motoboyDinheiro + trocoDelta);
  const diff = round2(somaAjustada - total);
  const ok = Math.abs(diff) < 0.02;
  return {
    soma:round2(soma), total:round2(total), retiradas:round2(retiradas),
    motoboyDinheiro:round2(motoboyDinheiro), trocoDelta, trocoUsado, trocoReforco,
    somaAjustada, diff, ok, legado:false,
    status: ok ? 'ok' : (diff < 0 ? 'falta' : 'sobra'),
    texto: ok ? 'Caixa fechado certinho'
              : (diff < 0 ? 'Falta de ' + money(Math.abs(diff))
                          : 'Sobra de ' + money(Math.abs(diff)))
  };
}

// Registros salvos ANTES da v2 seguiam outro processo: o campo Dinheiro era
// lançado BRUTO (antes de pagar o motoboy). Somar o repasse neles criaria
// sobra falsa. Por isso o histórico continua sendo conferido pela regra antiga.
function calcLegado(f) {
  const soma = round2(somaConf(f.conf||{}));
  const total = round2(fatF(f));
  const retiradas = round2(totalRetiradasDoDia(f.data) + totalSaidasLegado(f));
  const somaAjustada = round2(soma + retiradas);
  const diff = round2(somaAjustada - total);
  const ok = Math.abs(diff) < 0.02;
  return { soma, total, retiradas, motoboyDinheiro:0, trocoDelta:0, trocoUsado:0, trocoReforco:0,
    somaAjustada, diff, ok, legado:true,
    status: ok?'ok':(diff<0?'falta':'sobra'),
    texto: ok ? 'Caixa fechado certinho'
              : (diff<0 ? 'Falta de ' + money(Math.abs(diff)) : 'Sobra de ' + money(Math.abs(diff))) };
}

function calcFechamentoSalvo(f) {
  if (!(+f.versaoCalculo >= 2)) return calcLegado(f);
  return calcFechamento({
    soma: somaConf(f.conf||{}),
    total: fatF(f),
    retiradas: totalRetiradasDoDia(f.data) + totalSaidasLegado(f),
    motoboyDinheiro: +f.motoboyRepasse||0,
    trocoInicio: +f.trocoInicio||0,
    trocoFinal: +f.trocoFinal||0
  });
}
// Diferença de caixa: NEGATIVO = falta, POSITIVO = sobra
function diffCaixa(f){ return calcFechamentoSalvo(f).diff; }

// Troco final do último fechamento ANTERIOR à data informada
function trocoFinalAnterior(data, ignorarId) {
  const d = normData(data);
  if (!d) return null;
  const ant = (S.fechamentos||[])
    .filter(f => f.id !== ignorarId && normData(f.data) && normData(f.data) < d)
    .sort((a,b)=>normData(b.data).localeCompare(normData(a.data)))[0];
  return ant ? { valor:+ant.trocoFinal||0, data:ant.data, caixa:ant.caixa||'' } : null;
}

];
function cfg(chave, padrao) {
  const r = (S.config||[]).find(x=>x.chave===chave);
  const v = r ? +r.valor : NaN;
  return isNaN(v) ? (padrao===undefined?0:padrao) : v;
}
function setCfg(chave, valor) {
  const r = (S.config||[]).find(x=>x.chave===chave);
  if (r) r.valor = valor; else S.config.push({id:uid(), chave, valor});
}
function calcMetas(refData) {
  const metaMes = cfg('metaMes'), custoFixo = cfg('custoFixo');
  const cmv = cfg('cmv'), taxas = cfg('taxas');
  const mc = Math.max(0, 1 - (cmv/100) - (taxas/100));
  const pe = mc > 0 ? custoFixo / mc : 0;

  const ref = normData(refData) || hojeStr();
  const mes = ref.slice(0,7);
  const doMes = (S.fechamentos||[]).filter(f=>normData(f.data).slice(0,7)===mes && fatF(f)>0);
  const acum = round2(doMes.reduce((a,f)=>a+fatF(f), 0));

  const diasNoMes = new Date(+mes.slice(0,4), +mes.slice(5,7), 0).getDate();
  const diaAtual = +ref.slice(8,10);
  const diasRestantes = Math.max(0, diasNoMes - diaAtual);
  const diasComVenda = new Set(doMes.map(f=>f.data)).size;
  const mediaDia = diasComVenda ? acum/diasComVenda : 0;

  const faltaMeta = Math.max(0, metaMes - acum);
  const faltaPE = Math.max(0, pe - acum);
  return {
    metaMes, custoFixo, cmv, taxas, mc, pe, mes, acum,
    diasNoMes, diaAtual, diasRestantes, diasComVenda, mediaDia,
    projecao: mediaDia * diasNoMes,
    pctMeta: metaMes>0 ? acum/metaMes*100 : 0,
    pctPE:   pe>0      ? acum/pe*100      : 0,
    faltaMeta, faltaPE,
    precisaDiaMeta: diasRestantes>0 ? faltaMeta/diasRestantes : faltaMeta,
    precisaDiaPE:   diasRestantes>0 ? faltaPE/diasRestantes   : faltaPE,
    passouPE: pe>0 && acum >= pe,
    configurado: metaMes>0 || custoFixo>0
  };
}

async function mostrarBackups(){
  const h = await lsHist();
  if (!h.length) { toast('Nenhum backup local ainda — eles são criados a cada salvamento'); return; }
  const lista = h.map((x,i)=>`${i+1}. ${new Date(x.t).toLocaleString('pt-BR')} — ${x.n} fechamentos`).join('\n');
  const sel = prompt('BACKUPS LOCAIS (deste dispositivo)\nDigite o número para RESTAURAR, ou cancele:\n\n'+lista);
  if (sel === null) return;
  const idx = parseInt(sel,10)-1;
  if (isNaN(idx) || !h[idx]) { toast('Número inválido', true); return; }
  if (!confirm('Restaurar o backup de '+new Date(h[idx].t).toLocaleString('pt-BR')+'?\nOs dados atuais serão substituídos por esse backup e enviados ao Sheets.')) return;
  try{
    const d = JSON.parse(h[idx].data);
    KEYS.forEach(k=>{ if (Array.isArray(d[k])) S[k] = d[k]; });
    sheetSave(); render();
    toast('Backup restaurado');
  }catch(e){ toast('Erro ao restaurar', true); }
}

function atualizarConf() {
  const r = lerConf();
  const soma = somaConf(r);
  const total = +$('#f_total')?.value || 0;
  const data = $('#f_data')?.value || '';
  const ti = +$('#f_ti')?.value || 0, tf = +$('#f_tf')?.value || 0;
  const mrep = +$('#f_mrep')?.value || 0, mpix = +$('#f_mpix')?.value || 0;
  const fEdit = editandoId ? S.fechamentos.find(x=>x.id===editandoId) : null;
  const retiradas = totalRetiradasDoDia(data) + totalSaidasLegado(fEdit);

  const c = calcFechamento({soma, total, retiradas, motoboyDinheiro:mrep, trocoInicio:ti, trocoFinal:tf});

  if ($('#f_mtot')) $('#f_mtot').value = money(mrep + mpix);
  if ($('#f_tdelta')) {
    $('#f_tdelta').value = moneySign(c.trocoDelta);
    $('#f_tdelta').style.color = c.trocoDelta<-0.009?'var(--red)':c.trocoDelta>0.009?'var(--green)':'var(--muted)';
  }

  // travas do troco
  const ant = trocoFinalAnterior(data, editandoId);
  const divergeIni = !!ant && Math.abs(ti - ant.valor) > 0.009;
  const divergeFim = Math.abs(tf - ti) > 0.009;

  $('#troco_alerta_ini').innerHTML = divergeIni
    ? `<div class="warnbox">⚠️ O troco inicial (<b>${money(ti)}</b>) está diferente do troco final de ${fmtData(ant.data)} (<b>${money(ant.valor)}</b>) — diferença de <b>${moneySign(ti-ant.valor)}</b>. Descreva o motivo abaixo.</div>` : '';
  $('#troco_alerta_fim').innerHTML = divergeFim
    ? `<div class="warnbox">⚠️ Movimento do troco: <b>${moneySign(c.trocoDelta)}</b>. ${c.trocoUsado>0
        ? `Saíram <b>${money(c.trocoUsado)}</b> do troco — esse dinheiro <b>não veio de venda</b>, então cobre o motoboy ou a retirada no fechamento.`
        : `Entraram <b>${money(c.trocoReforco)}</b> no troco — dinheiro de venda que ficou na gaveta.`} Diga para onde foi.</div>` : '';
  $('#wrap_obs_ti').style.display = divergeIni ? '' : 'none';
  $('#wrap_obs_tf').style.display = divergeFim ? '' : 'none';

  const cls = c.ok ? 'ok' : (c.diff<0 ? 'bad' : 'sobra');
  const sinal = c.ok ? 'zero' : (c.diff<0 ? 'neg' : 'pos');
  $('#conf_box').innerHTML = `<div class="diffbox ${cls}" style="margin-bottom:10px">
    ${c.ok
      ? `✅ Conferência OK — total conferido ${money(c.somaAjustada)}`
      : `<div class="mini" style="color:inherit">Conferido ${money(c.somaAjustada)} · Vendas ${money(c.total)}</div>
         <span class="bignum ${sinal}">${moneySign(c.diff)}</span>
         <div style="font-weight:700">${c.diff<0?'❌ FALTA de ':'🟢 SOBRA de '}${money(Math.abs(c.diff))}</div>`}
  </div>`;

  const linhaAj = (lab,val)=> Math.abs(val)>0.009 ? `<div class="cline aj"><span>+ ${lab}</span><span>${money(val)}</span></div>` : '';
  $('#conf_resumo').innerHTML =
    CONF_CAMPOS.map(x=>`<div class="cline"><span>${x.label}</span><span>${money(r[x.id]||0)}</span></div>`).join('')+
    `<div class="cline tot"><span>Soma recebimentos</span><span style="color:var(--ember)">${money(c.soma)}</span></div>`+
    linhaAj('Retiradas do caixa', c.retiradas)+
    linhaAj('Motoboy em dinheiro', c.motoboyDinheiro)+
    (Math.abs(c.trocoDelta)>0.009
      ? `<div class="cline aj"><span>${c.trocoDelta<0?'− Troco consumido':'+ Troco reforçado'}</span><span>${moneySign(c.trocoDelta)}</span></div>` : '')+
    `<div class="cline tot"><span>Total conferido</span><span style="color:var(--gold)">${money(c.somaAjustada)}</span></div>
     <div class="cline tot"><span>Total de vendas</span><span>${money(c.total)}</span></div>
     <div class="diffbox ${cls}" style="margin-top:10px">
       ${c.ok?'✅ Caixa fechado certinho'
             :`<span class="bignum ${sinal}">${moneySign(c.diff)}</span><div style="font-weight:700">${c.texto}</div>`}
     </div>
     ${mpix>0?`<div class="mini" style="margin-top:10px;text-align:center;color:var(--muted2)">🛵 Motoboy PIX ${money(mpix)} — fora do caixa (não entra nem sai)</div>`:''}`;
}

function renderRetiradaBox() {

async function addRetiradaRapida() {
  const valor = +$('#rt_valor').value||0;
  const obs = ($('#rt_obs').value||'').trim();
  const data = normData($('#f_data').value);
  if (!data)   { toast('Informe a data do fechamento primeiro', true); return; }
  if (valor<=0){ $('#rt_valor').classList.add('err'); toast('Informe o valor da retirada', true); return; }
  if (!obs)    { $('#rt_obs').classList.add('err'); toast('A observação da retirada é obrigatória', true); return; }
  $('#rt_valor').classList.remove('err'); $('#rt_obs').classList.remove('err');
  S.retiradas.push({id:uid(), data, valor, obs,
    operador:($('#f_caixa').value||'').trim(), criadoEm:new Date().toLocaleString('pt-BR')});
  $('#rt_valor').value=''; $('#rt_obs').value='';
  await sheetSave();
  renderRetiradaBox(); atualizarConf();
  toast('Retirada registrada — ' + money(valor));
}

async function salvarFechamento() {
  const r = lerConf();
  const soma = somaConf(r);
  const total = +$('#f_total').value||0;
  if (soma <= 0 && total <= 0) { toast('Preencha os valores do turno', true); return; }
  const dataVal = normData($('#f_data').value);
  if (!dataVal) { toast('Data inválida — confira o campo Data', true); return; }
  if (!editandoId) {
    const jaExiste = S.fechamentos.find(x=>normData(x.data)===dataVal);
    if (jaExiste && !confirm('Já existe um fechamento em '+fmtDataBR(dataVal)+' ('+money(fatF(jaExiste))+').\nSalvar OUTRO fechamento para o mesmo dia?')) return;
  }

  const ti = +$('#f_ti').value||0, tf = +$('#f_tf').value||0;
  const mrep = +$('#f_mrep').value||0, mpix = +$('#f_mpix').value||0;
  const obsTi = ($('#f_obs_ti').value||'').trim();
  const obsTf = ($('#f_obs_tf').value||'').trim();
  const destTroco = ($('#f_dest_troco').value||'').trim();

  // travas obrigatórias do troco
  const ant = trocoFinalAnterior(dataVal, editandoId);
  if (ant && Math.abs(ti - ant.valor) > 0.009 && !obsTi) {
    $('#f_obs_ti').classList.add('err'); $('#f_obs_ti').focus();
    toast('Justifique a diferença do troco inicial antes de salvar', true); return;
  }
  if (Math.abs(tf - ti) > 0.009 && !destTroco) {
    $('#f_dest_troco').classList.add('err'); $('#f_dest_troco').focus();
    toast('Diga para onde foi o troco antes de salvar', true); return;
  }
  if (destTroco === 'outro' && !obsTf) {
    $('#f_obs_tf').classList.add('err'); $('#f_obs_tf').focus();
    toast('Descreva o que aconteceu com o troco', true); return;
  }

  const fAtual = editandoId ? S.fechamentos.find(x=>x.id===editandoId) : null;
  const c = calcFechamento({soma, total,
    retiradas: totalRetiradasDoDia(dataVal) + totalSaidasLegado(fAtual),
    motoboyDinheiro: mrep, trocoInicio: ti, trocoFinal: tf});

  if (!c.ok) {
    const msg = (c.diff<0 ? 'FALTA de ' : 'SOBRA de ') + money(Math.abs(c.diff));
    if (!confirm('O caixa não fechou: '+msg+' ('+moneySign(c.diff)+').\n\nSalvar assim mesmo?')) return;
  }

  const f = {
    id: editandoId || uid(),
    data: dataVal, caixa:$('#f_caixa').value,
    conf:r, totalVendas:total,
    trocoInicio:ti, trocoFinal:tf,
    obsTrocoInicio:obsTi, obsTrocoFinal:obsTf, destinoTroco:destTroco,
    trocoMovimento: round2(tf - ti),
    motoboyRepasse:mrep, motoboyPix:mpix, motoboyTotal: round2(mrep + mpix),
    saidas: (fAtual && fAtual.saidas) || [],           // preserva registros antigos
    retiradasTotal: totalRetiradasDoDia(dataVal),
    totalConferido: c.somaAjustada,
    diferenca: c.diff,
    statusCaixa: c.ok ? 'OK' : (c.diff < 0 ? 'FALTA' : 'SOBRA'),
    versaoCalculo: 2,
    vendas:draftVendas.filter(v=>v.qtd>0).map(v=>({pid:v.pid,qtd:v.qtd})),
    obs:$('#f_obs').value
  };
  if (editandoId) {
    const idx = S.fechamentos.findIndex(x=>x.id===editandoId);
    if (idx>=0) S.fechamentos[idx] = {...S.fechamentos[idx], ...f}; else S.fechamentos.push(f);
    editandoId = null;
    toast('Fechamento atualizado');
  } else {
    f.vendas.forEach(v=>{const p=produto(v.pid);if(p)(p.ficha||[]).forEach(([iid,q])=>{const i=insumo(iid);if(i)i.qtd=Math.max(0,i.qtd-q*v.qtd);});});
    S.fechamentos.push(f);
    toast('Fechamento salvo — enviando ao Sheets...');
  }
  await sheetSave();
  draftVendas=[];
  render();
}

function renderUltimos() {
  const last = [...S.fechamentos]
    .filter(f => isRegistroReal(f) && (normData(f.data) || fatF(f) > 0))
    .sort((a,b) => (normData(b.data)||'0000').localeCompare(normData(a.data)||'0000'))

const DEST_TROCO = {
  motoboy:  {ic:'🛵', txt:'Pagamento do motoboy', tag:'mid'},
  retiradas:{ic:'📤', txt:'Completou retirada do caixa', tag:'mid'},
  reforco:  {ic:'➕', txt:'Reforço de troco', tag:'ok'},
  outro:    {ic:'✏️', txt:'Outro', tag:'inat'}
};
function renderTroco() {
  const fs = [...S.fechamentos]
    .filter(f => isRegistroReal(f) && normData(f.data))
    .sort((a,b)=>normData(b.data).localeCompare(normData(a.data)))
    .slice(0,90);

  let alertas = 0, consumido = 0, reforcado = 0;
  const linhas = fs.map((f,i)=>{
    const ti = +f.trocoInicio||0, tf = +f.trocoFinal||0;
    const delta = round2(tf - ti);
    if (delta < -0.009) consumido = round2(consumido - delta);
    if (delta >  0.009) reforcado = round2(reforcado + delta);
    const ant = fs[i+1];
    const antTf = ant ? (+ant.trocoFinal||0) : null;
    const quebra = ant !== undefined && Math.abs(ti - antTf) > 0.009;
    if (quebra) alertas++;
    return {f, ti, tf, delta, quebra, antTf};
  });

  const ultimo = fs[0];
  const trocoAtual = ultimo ? (+ultimo.trocoFinal||0) : 0;

  view.innerHTML = `
  <div class="head"><div><div class="ey">Fundo de caixa</div><h1>Balanço do troco</h1>
  <p>Quando o troco <b>diminui</b>, aquele dinheiro não veio de venda — foi para o motoboy ou completou uma retirada, e o fechamento já considera isso. Quando <b>aumenta</b>, é dinheiro de venda que ficou na gaveta.</p></div></div>

  <div class="grid kpis" style="margin-bottom:14px">
    <div class="card kpi"><div class="lab">Troco na gaveta agora</div><div class="val em">${money(trocoAtual)}</div><div class="sub">fim de ${ultimo?fmtDataBR(ultimo.data):'—'}</div></div>
    <div class="card kpi"><div class="lab">Consumido no período</div><div class="val rd">${money(consumido)}</div><div class="sub">saiu do troco</div></div>
    <div class="card kpi"><div class="lab">Reforçado no período</div><div class="val gr">${money(reforcado)}</div><div class="sub">entrou no troco</div></div>
    <div class="card kpi"><div class="lab">Quebras de continuidade</div><div class="val ${alertas?'rd':'gr'}">${alertas}</div><div class="sub">abertura ≠ fecho anterior</div></div>
  </div>

  ${alertas?`<div class="alert"><span>⚠️</span><div><b>${alertas} ${alertas>1?'dias abriram':'dia abriu'} com troco diferente do fechamento anterior.</b> As linhas marcadas em vermelho abaixo precisam de justificativa no fechamento.</div></div>`:''}

  <div class="panel">
    <div class="ph"><div><h3>Movimento dia a dia</h3><div class="sub">últimos ${linhas.length} fechamentos</div></div></div>
    <div class="scrollx"><table><thead><tr>
      <th>Data</th><th>Caixa</th><th class="n">Fechou anterior</th><th class="n">Abriu</th>
      <th class="n">Fechou</th><th class="n">Movimento</th><th>Destino</th><th>Justificativa</th>
    </tr></thead><tbody>
    ${linhas.map(l=>{
      const d = DEST_TROCO[l.f.destinoTroco] || null;
      return `<tr>
      <td class="mini" style="font-family:'Space Mono'">${fmtData(l.f.data)}</td>
      <td>${esc(l.f.caixa)||'—'}</td>
      <td class="n mini">${l.antTf==null?'—':money(l.antTf)}</td>
      <td class="n ${l.quebra?'neg':''}">${money(l.ti)}${l.quebra?' ⚠️':''}</td>
      <td class="n">${money(l.tf)}</td>
      <td class="n ${l.delta<-0.009?'neg':l.delta>0.009?'pos':''}"><b>${Math.abs(l.delta)<0.009?'—':moneySign(l.delta)}</b></td>
      <td>${d?`<span class="tag ${d.tag}">${d.ic} ${d.txt}</span>`:(Math.abs(l.delta)>0.009?'<span class="tag lo">sem destino</span>':'<span class="mini">—</span>')}</td>
      <td class="mini">${esc(l.f.obsTrocoFinal||l.f.obsTrocoInicio||'')||'—'}</td>
    </tr>`;}).join('')||'<tr><td colspan="8"><div class="empty">Nenhum fechamento com troco lançado</div></td></tr>'}
    </tbody></table></div>
  </div>`;
}

// ============================================================
let _charts = {};
let balPeriodo = 30;   // 7 | 30 | 90 | 0 (tudo)
let balAgrupa = 'dia'; // dia | semana | mes
let balMes = '';       // '' = período corrido | 'YYYY-MM' = só aquele mês
const MESES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function nomeMes(ym){ return MESES_NOMES[+ym.slice(5,7)-1]+'/'+ym.slice(0,4); }

function chaveSemana(dstr){
  const d = new Date(normData(dstr)+'T12:00:00');
  const dow = (d.getDay()+6)%7; // 0 = segunda
  d.setDate(d.getDate()-dow);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function chaveMes(dstr){ return normData(dstr).slice(0,7); }

function renderBalanco() {
  const todos = S.fechamentos.map(normFech).filter(f => isRegistroReal(f) && fatF(f) > 0);
  const semData = todos.filter(f=>!f.data).length;
  const comData = todos.filter(f=>f.data).sort((a,b)=>a.data.localeCompare(b.data));

  if (!comData.length) {
    view.innerHTML='<div class="head"><div><div class="ey">Análise</div><h1>Balanço</h1></div></div><div class="panel"><div class="empty">Salve fechamentos com valores para ver o balanço.</div></div>';
    return;
  }

  const mesesDisp = [...new Set(comData.map(f=>f.data.slice(0,7)))].sort().reverse();
  if (balMes && !mesesDisp.includes(balMes)) balMes = '';

  let base = comData;
  if (balMes) {
    base = comData.filter(f=>f.data.slice(0,7) === balMes);
  } else if (balPeriodo > 0) {
    const cut = new Date(); cut.setDate(cut.getDate()-balPeriodo);
    const cutStr = cut.getFullYear()+'-'+String(cut.getMonth()+1).padStart(2,'0')+'-'+String(cut.getDate()).padStart(2,'0');
    const win = comData.filter(f=>f.data >= cutStr);
    base = win.length ? win : comData;
  }

  const resumoMeses = {};
  comData.forEach(f=>{
    const m = f.data.slice(0,7);
    const r = resumoMeses[m] = resumoMeses[m] || {total:0, dias:new Set(), motoboy:0, fiado:0, voucher:0, dif:0, retirada:0};
    r.total = round2(r.total + fatF(f));
    r.dias.add(f.data);
    r.motoboy = round2(r.motoboy + (+f.motoboyRepasse||0) + (+f.motoboyPix||0));
    r.fiado = round2(r.fiado + (+(f.conf?.pg_colaborador)||0));
    r.voucher = round2(r.voucher + (+(f.conf?.pg_voucher)||0));
    r.dif = round2(r.dif + diffCaixa(f));
    r.retirada = round2(r.retirada + totalRetiradasDoDia(f.data) + totalSaidasLegado(f));
  });

  const fatT = round2(base.reduce((a,f)=>a+fatF(f), 0));
  const nDias = new Set(base.map(f=>f.data)).size || 1;
  const media = fatT / nDias;
  const melhor = [...base].sort((a,b)=>fatF(b)-fatF(a))[0];
  const motRecebido = round2(base.reduce((a,f)=>a+(+(f.conf?.pg_motoboy||0)), 0));
  const motRepasse = round2(base.reduce((a,f)=>a+(+f.motoboyRepasse||0), 0));
  const motPix = round2(base.reduce((a,f)=>a+(+f.motoboyPix||0), 0));
  const fiadoT = round2(base.reduce((a,f)=>a+(+(f.conf?.pg_colaborador||0)), 0));
  const voucherT = round2(base.reduce((a,f)=>a+(+(f.conf?.pg_voucher||0)), 0));
  const difT = round2(base.reduce((a,f)=>a+diffCaixa(f), 0));
  const diasComDif = base.filter(f=>Math.abs(diffCaixa(f))>=0.02);
  const retT = round2(base.reduce((a,f)=>a+totalRetiradasDoDia(f.data)+totalSaidasLegado(f), 0));
  const cmvT = base.reduce((a,f)=>a+cmvFech(f), 0);
  const nLegado = base.filter(f=>!(+f.versaoCalculo>=2)).length;

  const mix = {'Cartão':0,'Cartão CPF':0,'Pago Online':0,'Voucher':0,'PIX Online':0,'Dinheiro':0,'Motoboy':0,'Fiado/Colab.':0};
  base.forEach(f=>{const c=f.conf||{};
    mix['Cartão']+=(+c.pg_cartao||0);
    mix['Cartão CPF']+=(+c.pg_cartaocpf||0);
    mix['Pago Online']+=(+c.pg_online||0);
    mix['Voucher']+=(+c.pg_voucher||0);
    mix['PIX Online']+=(+c.pg_onlinepix||0);
    mix['Dinheiro']+=(+c.pg_dinheiro||0);
    mix['Motoboy']+=(+c.pg_motoboy||0);
    mix['Fiado/Colab.']+=(+c.pg_colaborador||0);
  });
  Object.keys(mix).forEach(k=>mix[k]=round2(mix[k]));
  const mixTotal = round2(Object.values(mix).reduce((a,b)=>a+b,0));

  const grupos = {};
  base.forEach(f=>{
    const k = balAgrupa==='dia' ? f.data : balAgrupa==='semana' ? chaveSemana(f.data) : chaveMes(f.data);
    grupos[k] = round2((grupos[k]||0) + fatF(f));
  });
  const gKeys = Object.keys(grupos).sort();
  const gLabels = gKeys.map(k => balAgrupa==='mes' ? k.split('-').reverse().join('/') : (balAgrupa==='semana' ? 'sem '+fmtData(k) : fmtData(k)));

  const porDow = {};
  base.forEach(f=>{
    const w = weekdayOf(f.data); if (w<0) return;
    (porDow[w] = porDow[w]||[]).push(fatF(f));
  });
  const dowStats = Object.entries(porDow).map(([w,arr])=>({
    w:+w, nome:DIAS_SEMANA[+w], n:arr.length,
    media: round2(arr.reduce((a,b)=>a+b,0)/arr.length),
    total: round2(arr.reduce((a,b)=>a+b,0))
  })).sort((a,b)=>b.media-a.media);

  const motoDias = base.filter(f=>(+f.conf?.pg_motoboy||0)>0 || (+f.motoboyRepasse||0)>0 || (+f.motoboyPix||0)>0);
  const periodoLabel = balMes ? nomeMes(balMes) : (balPeriodo===0?'Todos os registros':'Últimos '+balPeriodo+' dias');

  view.innerHTML = `
  <div class="head"><div><div class="ey">${periodoLabel} · ${nDias} dias com fechamento</div><h1>Balanço</h1></div></div>
  ${semData?`<div class="alert"><span>⚠️</span><div><b>${semData} fechamento(s) com data inválida</b> — aparecem no total mas fora dos gráficos. Edite-os na aba Fechamento para corrigir a data.</div></div>`:''}
  <div class="selbar">
    <span class="lbl">Mês</span>
    ${mesesDisp.map(m=>`<button class="btn sm ${balMes===m?'gold':'ghost'}" onclick="balMes=(balMes==='${m}'?'':'${m}');renderBalanco()">${nomeMes(m)}</button>`).join('')}
    <span class="lbl">Período</span>
    ${[[7,'7 dias'],[30,'30 dias'],[90,'90 dias'],[0,'Tudo']].map(([v,l])=>`<button class="btn sm ${(!balMes&&balPeriodo===v)?'':'ghost'}" onclick="balMes='';balPeriodo=${v};renderBalanco()">${l}</button>`).join('')}
    <span class="lbl">Agrupar</span>
    ${[['dia','Dia'],['semana','Semana'],['mes','Mês']].map(([v,l])=>`<button class="btn sm ${balAgrupa===v?'':'ghost'}" onclick="balAgrupa='${v}';renderBalanco()">${l}</button>`).join('')}
  </div>
  ${mesesDisp.length>1?`<div class="panel" style="margin-bottom:14px"><div class="ph"><div><h3>Resumo por mês</h3><div class="sub">clique num mês acima para ver só ele</div></div></div>
    <div class="scrollx"><table><thead><tr><th>Mês</th><th class="n">Dias</th><th class="n">Total vendido</th><th class="n">Média/dia</th><th class="n">Motoboy (custo)</th><th class="n">Retiradas</th><th class="n">Fiado</th><th class="n">Voucher</th><th class="n">Dif. caixa</th></tr></thead><tbody>
    ${Object.keys(resumoMeses).sort().reverse().map(m=>{const r=resumoMeses[m];const nd=r.dias.size||1;return `<tr style="${balMes===m?'background:rgba(224,168,62,.07)':''}">
      <td><b>${nomeMes(m)}</b></td><td class="n">${r.dias.size}</td>
      <td class="n"><b>${money(r.total)}</b></td><td class="n">${money(r.total/nd)}</td>
      <td class="n">${money(r.motoboy)}</td><td class="n">${money(r.retirada)}</td><td class="n">${money(r.fiado)}</td><td class="n">${money(r.voucher)}</td>
      <td class="n ${Math.abs(r.dif)<0.02?'':(r.dif<0?'neg':'pos')}">${Math.abs(r.dif)<0.02?'✓':moneySign(r.dif)}</td></tr>`;}).join('')}
    </tbody></table></div></div>`:''}
  <div class="grid kpis" style="margin-bottom:14px">
    <div class="card kpi"><div class="lab">Total de Vendas</div><div class="val em">${money(fatT)}</div><div class="sub">${nDias} dias</div></div>
    <div class="card kpi"><div class="lab">Média/dia</div><div class="val">${money(media)}</div></div>
    <div class="card kpi"><div class="lab">Melhor dia</div><div class="val gd">${money(melhor?fatF(melhor):0)}</div><div class="sub">${melhor?fmtDataBR(melhor.data)+' ('+DIAS_SEMANA[weekdayOf(melhor.data)]+')':''}</div></div>
    <div class="card kpi"><div class="lab">Diferença de caixa</div><div class="val ${Math.abs(difT)<0.02?'gr':(difT<0?'rd':'gr')}">${Math.abs(difT)<0.02?money(0):moneySign(difT)}</div><div class="sub">${diasComDif.length} dia(s) com diferença</div></div>
    <div class="card kpi"><div class="lab">Retiradas do caixa</div><div class="val gd">${money(retT)}</div><div class="sub">${fatT?(retT/fatT*100).toFixed(1).replace('.',','):0}% do total</div></div>
    <div class="card kpi"><div class="lab">Fiado / Colaborador</div><div class="val">${money(fiadoT)}</div><div class="sub">${fatT?(fiadoT/fatT*100).toFixed(1).replace('.',','):0}% do total</div></div>
    <div class="card kpi"><div class="lab">Voucher</div><div class="val">${money(voucherT)}</div></div>
    ${cmvT?`<div class="card kpi"><div class="lab">CMV (fichas)</div><div class="val">${money(cmvT)}</div><div class="sub">${fatT?(cmvT/fatT*100).toFixed(0):0}%</div></div>`:''}
  </div>
  ${nLegado?`<div class="hint" style="margin:0 0 14px">ℹ️ ${nLegado} fechamento(s) deste período são anteriores à regra nova e continuam sendo conferidos pelo cálculo antigo — o histórico não foi alterado.</div>`:''}
  <div class="split" style="margin-bottom:14px">
    <div class="panel"><div class="ph"><h3>Vendas por ${balAgrupa==='dia'?'dia':balAgrupa==='semana'?'semana':'mês'}</h3></div><canvas id="ch1" height="150"></canvas></div>
    ${mixTotal>0?`<div class="panel"><div class="ph"><h3>Formas de pagamento</h3><div class="sub">${money(mixTotal)}</div></div><canvas id="ch2" height="150"></canvas></div>`:''}
  </div>
  <div class="split" style="margin-bottom:14px">
    <div class="panel"><div class="ph"><div><h3>Melhores dias da semana</h3><div class="sub">média por dia</div></div></div>
      <canvas id="ch3" height="130"></canvas>
      <table style="margin-top:10px"><thead><tr><th>Dia</th><th class="n">Fechamentos</th><th class="n">Média</th><th class="n">Total</th></tr></thead><tbody>
      ${dowStats.map((d,i)=>`<tr><td>${i===0?'🏆 ':''}<b>${d.nome}</b></td><td class="n">${d.n}</td><td class="n">${money(d.media)}</td><td class="n">${money(d.total)}</td></tr>`).join('')}
      </tbody></table></div>
    <div class="panel"><div class="ph"><div><h3>🏍 Relatório Motoboy</h3><div class="sub">período selecionado</div></div></div>
      <div class="cline"><span>Recebido pelo motoboy (na entrega)</span><span>${money(motRecebido)}</span></div>
      <div class="cline"><span>Pago em dinheiro (do caixa)</span><span>${money(motRepasse)}</span></div>
      <div class="cline"><span>Pago via PIX (conta)</span><span>${money(motPix)}</span></div>
      <div class="cline tot"><span>Custo total motoboy</span><span style="color:var(--ember)">${money(round2(motRepasse+motPix))}</span></div>
      <div class="scrollx" style="margin-top:10px;max-height:260px;overflow-y:auto">
      <table><thead><tr><th>Data</th><th class="n">Recebido</th><th class="n">Dinheiro</th><th class="n">PIX</th></tr></thead><tbody>
      ${motoDias.map(f=>`<tr><td class="mini" style="font-family:'Space Mono'">${fmtData(f.data)}</td><td class="n">${money(+f.conf?.pg_motoboy||0)}</td><td class="n">${money(+f.motoboyRepasse||0)}</td><td class="n">${money(+f.motoboyPix||0)}</td></tr>`).join('')||'<tr><td colspan=4><div class="empty">Sem movimentação</div></td></tr>'}
      </tbody></table></div></div>
  </div>
  ${diasComDif.length?`<div class="panel" style="margin-bottom:14px"><div class="ph"><div><h3>⚠️ Diferenças de caixa</h3><div class="sub">negativo = falta · positivo = sobra</div></div></div>
    <div class="scrollx"><table><thead><tr><th>Data</th><th>Caixa</th><th class="n">Recebimentos</th><th class="n">Retiradas</th><th class="n">Motoboy $</th><th class="n">Mov. troco</th><th class="n">Conferido</th><th class="n">Vendas</th><th class="n">Diferença</th><th>Obs</th></tr></thead><tbody>
    ${diasComDif.map(f=>{const c=calcFechamentoSalvo(f);return `<tr>
      <td class="mini" style="font-family:'Space Mono'">${fmtData(f.data)}</td>
      <td>${esc(f.caixa)||'—'}</td>
      <td class="n">${money(c.soma)}</td>
      <td class="n">${c.retiradas?money(c.retiradas):'—'}</td>
      <td class="n">${c.motoboyDinheiro?money(c.motoboyDinheiro):'—'}</td>
      <td class="n ${c.trocoDelta<-0.009?'neg':c.trocoDelta>0.009?'pos':''}">${Math.abs(c.trocoDelta)>0.009?moneySign(c.trocoDelta):'—'}</td>
      <td class="n" style="color:var(--gold)">${money(c.somaAjustada)}</td>
      <td class="n">${money(c.total)}</td>
      <td class="n ${c.diff<0?'neg':'pos'}"><b>${moneySign(c.diff)}</b></td>
      <td class="mini">${esc((f.obs||'').slice(0,60))}</td></tr>`;}).join('')}
    </tbody></table></div></div>`:''}
  <div class="panel"><div class="ph"><div><h3>Todos os fechamentos do período</h3><div class="sub">${base.length} registros</div></div></div>
    <div class="scrollx"><table><thead><tr><th>Data</th><th>Dia</th><th>Caixa</th><th class="n">Cartão</th><th class="n">Online</th><th class="n">Voucher</th><th class="n">PIX On.</th><th class="n">Dinheiro</th><th class="n">Motoboy</th><th class="n">Fiado</th><th class="n">Total</th><th class="n">Dif.</th></tr></thead><tbody>
    ${[...base].reverse().map(f=>{const c=f.conf||{};const d=diffCaixa(f);return `<tr>
      <td class="mini" style="font-family:'Space Mono'">${fmtData(f.data)}</td>
      <td class="mini">${DIAS_SEMANA[weekdayOf(f.data)]||'—'}</td>
      <td class="mini">${esc(f.caixa)||'—'}</td>
      <td class="n mini">${money((+c.pg_cartao||0)+(+c.pg_cartaocpf||0))}</td>
      <td class="n mini">${money(+c.pg_online||0)}</td>
      <td class="n mini">${money(+c.pg_voucher||0)}</td>
      <td class="n mini">${money(+c.pg_onlinepix||0)}</td>
      <td class="n mini">${money(+c.pg_dinheiro||0)}</td>
      <td class="n mini">${money(+c.pg_motoboy||0)}</td>
      <td class="n mini">${money(+c.pg_colaborador||0)}</td>
      <td class="n"><b>${money(fatF(f))}</b></td>
      <td class="n mini ${Math.abs(d)<0.02?'':(d<0?'neg':'pos')}">${Math.abs(d)<0.02?'✓':moneySign(d)}</td>
    </tr>`;}).join('')}
    </tbody></table></div></div>`;

  // Gráficos
  const cv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  Chart.defaults.color=cv('--muted'); Chart.defaults.font.family='Inter'; Chart.defaults.borderColor=cv('--line');
  Object.values(_charts).forEach(c=>{try{c.destroy()}catch(e){}});
  _charts = {};
  if ($('#ch1')) _charts.a = new Chart($('#ch1'),{type:'bar',data:{labels:gLabels,datasets:[{label:'Vendas',data:gKeys.map(k=>grupos[k]),backgroundColor:cv('--ember'),borderRadius:4}]},
    options:{plugins:{legend:{display:false}},scales:{y:{grid:{color:cv('--line')}},x:{grid:{display:false}}}}});
  if (mixTotal > 0 && $('#ch2')) {
    const mixE = Object.entries(mix).filter(([k,v])=>v>0);
    _charts.b = new Chart($('#ch2'),{type:'doughnut',data:{labels:mixE.map(x=>x[0]),datasets:[{data:mixE.map(x=>x[1]),backgroundColor:[cv('--blue'),'#8fc8e0',cv('--gold'),'#f0c878',cv('--ember'),cv('--green'),cv('--red'),cv('--muted2')],borderWidth:0}]},
      options:{cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:10,padding:8}}}}});
  }
  if ($('#ch3') && dowStats.length) {
    const ord = [1,2,3,4,5,6,0].map(w=>dowStats.find(d=>d.w===w)).filter(Boolean);
    _charts.c = new Chart($('#ch3'),{type:'bar',data:{labels:ord.map(d=>d.nome),datasets:[{label:'Média',data:ord.map(d=>d.media),backgroundColor:cv('--gold'),borderRadius:4}]},
      options:{plugins:{legend:{display:false}},scales:{y:{grid:{color:cv('--line')}},x:{grid:{display:false}}}}});
  }
}

function renderEstoque() {
  const low = S.insumos.filter(i=>i.qtd<i.min);
  view.innerHTML = `
  <div class="head"><div><div class="ey">Insumos</div><h1>Estoque</h1>
  <p>Registre compras para atualizar o custo pelo último valor pago. A baixa é automática quando você lança vendas por produto no fechamento.</p></div></div>
  ${low.length?`<div class="alert"><span>⚠️</span><div><b>${low.length} ${low.length>1?'itens':'item'} abaixo do mínimo</b> — vá em Fornecedores para disparar cotação.</div></div>`:''}
  <div class="split">
    <div class="panel"><div class="ph"><h3>Itens em estoque</h3><button class="btn ghost sm" id="addIns">+ insumo</button></div>
      <table><thead><tr><th>Item</th><th class="n">Qtd</th><th class="n">Mín.</th><th class="n">Custo/un</th><th></th></tr></thead>
      <tbody id="ins_body"></tbody></table></div>
    <div>
      <div class="panel" style="margin-bottom:14px"><div class="ph"><h3>Registrar compra</h3></div>
        <div class="field"><label>Item</label><select class="inp" id="c_item">${S.insumos.map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join('')}</select></div>
        <div class="row c2">
          <div class="field"><label>Quantidade</label><input class="inp mono" type="number" id="c_qtd" placeholder="0"></div>
          <div class="field"><label>Valor total da nota</label><input class="inp mono" type="number" id="c_val" placeholder="R$"></div>
        </div>
        <div class="mini" id="c_prev" style="margin:-4px 0 8px;min-height:16px"></div>
        <button class="btn gold" id="regComp" style="width:100%">Lançar compra</button>
        <div class="hint">Importação de XML da NF-e é fase 2. Lance o total da nota e o custo unitário é recalculado automaticamente.</div>
      </div>
      <div class="panel"><div class="ph"><h3>Ficha técnica</h3></div><div id="ficha_box"></div></div>
    </div>
  </div>`;
  renderInsBody(); renderFicha();
  $('#addIns').onclick = addInsumo;
  $('#regComp').onclick = regCompra;
  const prev = ()=>{const i=insumo($('#c_item').value),q=+$('#c_qtd').value,v=+$('#c_val').value;$('#c_prev').textContent=(i&&q&&v)?`Novo custo: ${money(v/q)} (era ${money(i.custo)})`:'';};
  ['c_item','c_qtd','c_val'].forEach(id=>$('#'+id).addEventListener('input',prev));
}
function renderInsBody(){
  $('#ins_body').innerHTML=S.insumos.map(i=>`<tr>
    <td><b>${esc(i.nome)}</b><div class="mini">${esc(i.un)}</div></td>
    <td class="n" style="color:${i.qtd<i.min?'var(--red)':'var(--cream)'}">${i.qtd}</td>
    <td class="n">${i.min}</td>
    <td class="n">${money(i.custo)}</td>
    <td><span class="tag ${i.qtd<i.min?'lo':'ok'}">${i.qtd<i.min?'baixo':'ok'}</span></td>
    <td><button class="btn ghost sm" data-edit-ins="${i.id}">✏️</button> <span class="px" data-del-ins="${i.id}">✕</span></td>
  </tr>`).join('')||'<tr><td colspan=6><div class="empty">Sem insumos</div></td></tr>';
  document.querySelectorAll('[data-edit-ins]').forEach(btn=>btn.onclick=()=>editarInsumo(btn.dataset.editIns));
  document.querySelectorAll('[data-del-ins]').forEach(x=>x.onclick=async()=>{
    if(!confirm('Excluir insumo?'))return;
    const id=x.dataset.delIns; addDeleted(id);
    S.insumos=S.insumos.filter(i=>i.id!==id);await sheetSave();toast('Insumo excluído');renderEstoque();});
}
async function editarInsumo(id){
  const i=insumo(id);if(!i)return;
  const nome=prompt('Nome:',i.nome);if(nome===null)return;
  const un=prompt('Unidade:',i.un)||i.un;
  const min=prompt('Estoque mínimo:',i.min);
  const custo=prompt('Custo unitário (R$):',i.custo);
  const qtd=prompt('Quantidade atual:',i.qtd);
  i.nome=nome||i.nome; i.un=un; i.min=+min||i.min; i.custo=+custo||i.custo; i.qtd=+qtd||i.qtd;
  await sheetSave();toast('Insumo atualizado');renderEstoque();
}
async function addInsumo(){const nome=prompt('Nome:');if(!nome)return;const un=prompt('Unidade:','un')||'un';const min=+prompt('Mínimo:','0');const custo=+prompt('Custo unitário (R$):','0');
  S.insumos.push({id:uid(),nome,un,qtd:0,min,custo});await sheetSave();toast('Insumo cadastrado');renderEstoque();}
async function regCompra(){const i=insumo($('#c_item').value);const q=+$('#c_qtd').value,v=+$('#c_val').value;if(!i||q<=0||v<=0){toast('Preencha item, quantidade e valor',true);return;}
  i.qtd+=q;i.custo=v/q;await sheetSave();toast(`${i.nome}: +${q} · custo ${money(i.custo)}`);renderEstoque();}
function renderFicha(){$('#ficha_box').innerHTML=S.produtos.map(p=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b style="font-size:13px">${esc(p.nome)}</b>
    <div style="display:flex;gap:6px;align-items:center">
      <span class="mini">custo ${money(custoProd(p))} · venda ${money(p.preco)}</span>
      <button class="btn ghost sm" data-edit-prod="${p.id}">✏️</button>
      <span class="px" data-del-prod="${p.id}">✕</span>
    </div>
  </div>
  <div style="margin-top:4px">${(p.ficha||[]).map(([iid,q])=>{const i=insumo(iid);return i?`<span class="chip">${esc(i.nome)} <b>${q}${esc(i.un)}</b></span>`:'';}).join('')||'<span class="mini" style="color:var(--muted2)">sem ficha</span>'}</div>
  </div>`).join('')||'<div class="empty">Sem produtos</div>';
  document.querySelectorAll('[data-edit-prod]').forEach(btn=>btn.onclick=()=>editarProduto(btn.dataset.editProd));
  document.querySelectorAll('[data-del-prod]').forEach(x=>x.onclick=async()=>{
    if(!confirm('Excluir produto?'))return;
    const id=x.dataset.delProd; addDeleted(id);
    S.produtos=S.produtos.filter(p=>p.id!==id);await sheetSave();toast('Produto excluído');renderEstoque();});
}
async function editarProduto(id){
  const p=produto(id);if(!p)return;
  const nome=prompt('Nome do produto:',p.nome);if(nome===null)return;

function diasDesde(d){return Math.floor((Date.now()-new Date(d).getTime())/864e5);}

function temperatura(c){
  const rec = c.diasUltimoPedido!=null ? +c.diasUltimoPedido : 9999;
  const comp = +c.compras || (c.comprasLegado||[]).length || 0;
  if(rec<=15 && comp>=5) return 'quente';
  if(rec<=30 && comp>=2) return 'quente';
  if(rec<=45) return 'morna';
  return 'fria';
}
function tempLabel(t){return t==='quente'?'🔥 Quente':t==='morna'?'🌡️ Morna':'🧊 Fria';}
function tempColor(t){return t==='quente'?'var(--ember)':t==='morna'?'var(--gold)':'var(--blue)';}
function tempTag(t){return t==='quente'?'vip':t==='morna'?'mid':'inat';}

function parsarCSVClientes(texto){
  const linhas=texto.trim().split('\n');
  if(linhas.length<2)return[];
  const sep=linhas[0].includes(';')?';':',';
  const headers=linhas[0].split(sep).map(h=>h.trim().replace(/"/g,'').toLowerCase());
  const col=(names)=>{for(const n of names){const i=headers.findIndex(h=>h.includes(n));if(i>=0)return i;}return -1;};
  const iNome=col(['cliente','nome','name']);
  const iTel=col(['telefone','tel','phone','whatsapp','celular','fone']);
  const iBairro=col(['bairro','neighborhood']);
  const iUltimo=col(['último pedido','ultimo pedido','last order','último','data']);
  const iCompras=col(['compras','pedidos','orders','qtd']);
  const iFat=col(['faturado','total','receita','valor']);
  const iTicket=col(['ticket','ticket médio','média']);
  const iOrigem=col(['origem','canal','source']);
  const iDesde=col(['cliente desde','desde','membro']);
  const clientes=[];
  for(let i=1;i<linhas.length;i++){
    const row=linhas[i].split(sep).map(c=>c.trim().replace(/"/g,''));
    if(!row[iNome]||!row[iNome].trim())continue;
    let diasUltimoPedido=9999;
    if(iUltimo>=0&&row[iUltimo]){
      const raw=row[iUltimo];
      const mBR=raw.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      const mISO=raw.match(/(\d{4})-(\d{2})-(\d{2})/);
      if(mBR)diasUltimoPedido=diasDesde(`${mBR[3]}-${mBR[2]}-${mBR[1]}`);
      else if(mISO)diasUltimoPedido=diasDesde(mISO[0]);
    }
    let wpp=iTel>=0?row[iTel]:'';
    wpp=wpp.replace(/\D/g,'');
    if(wpp.length===11)wpp='55'+wpp;
    const fatVal=iFat>=0?+row[iFat].replace(/[R$\s.]/g,'').replace(',','.'):0;
    const ticketVal=iTicket>=0?+row[iTicket].replace(/[R$\s.]/g,'').replace(',','.'):0;
    const comprasVal=iCompras>=0?+row[iCompras]:0;
    clientes.push({id:uid(),nome:row[iNome],whatsapp:wpp,
      bairro:iBairro>=0?row[iBairro]:'',origem:iOrigem>=0?row[iOrigem]:'',
      clienteDesde:iDesde>=0?row[iDesde]:'',ultimoPedidoRaw:iUltimo>=0?row[iUltimo]:'',
      diasUltimoPedido,compras:comprasVal,faturado:fatVal,
      ticketMedio:ticketVal||(comprasVal>0?fatVal/comprasVal:0),comprasLegado:[]});
  }
  return clientes;
}

      <input class="url-inp" id="cfg_url" value="${esc(SHEET_URL)}" style="font-size:11px;color:var(--muted)">
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="cfg_save">Salvar URL</button>
      <button class="btn ghost" id="cfg_test">Testar conexão</button>
    </div>
    <div id="cfg_result" style="margin-top:12px;font-size:13px;min-height:20px"></div>
  </div>
  <div class="panel">
    <h3 style="margin-bottom:6px">Backup dos dados</h3>
    <div style="margin-bottom:12px;font-size:13px;color:var(--muted)">${histInfo}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn gold" id="cfg_export">⬇ Baixar backup (JSON)</button>
      <button class="btn ghost" id="cfg_restore">🛟 Restaurar backup local</button>
    </div>
    <div class="hint">A cada salvamento o sistema guarda uma cópia neste dispositivo (últimas 15 versões), além do Google Sheets. Baixe o JSON periodicamente como terceira camada de segurança.</div>
  </div>
  <div class="panel">
    <h3 style="margin-bottom:6px">Registros carregados agora</h3>
    <div class="mini" style="line-height:1.8">${cont}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn ghost" onclick="syncNow()">↻ Recarregar do Sheets</button>
    </div>
    <div class="hint">Se algum número aparecer zerado e você sabe que havia dados, <b>não salve nada</b>: baixe o backup JSON e depois recarregue do Sheets.</div>
  </div>
  </div>`;
  $('#cfg_trava').onchange = e => { localStorage.setItem('ccTrava', e.target.value); armarTrava(); toast('Bloqueio automático atualizado'); };
  $('#cfg_sair').onclick = ()=>{ if(confirm('Bloquear o sistema agora?')) sair(); };
  $('#cfg_addu').onclick = async ()=>{
    const nome = prompt('Nome do novo usuário (ex: Ana):'); if(!nome||!nome.trim()) return;
    const s1 = prompt('Senha para ' + nome.trim() + ' (mínimo 6 caracteres):'); if(s1===null) return;
    if (String(s1).length < 6) { toast('Senha muito curta', true); return; }
    const s2 = prompt('Repita a senha:'); if(s2===null) return;
    if (s1 !== s2) { toast('As senhas não conferem', true); return; }
    await criarUsuario(nome.trim(), s1, ACCESS_KEY);
    toast(nome.trim() + ' agora pode entrar neste aparelho');
    renderConfig();
  };
  $('#cfg_trocar_senha').onclick = async ()=>{
    const atual = prompt('Digite sua senha ATUAL:'); if(atual===null) return;
    const r = await entrar(SESSAO.id, atual);
    if (!r.ok) { toast('Senha atual incorreta', true); return; }
    const s1 = prompt('Nova senha (mínimo 6):'); if(s1===null) return;
    if (String(s1).length < 6) { toast('Senha muito curta', true); return; }
    const s2 = prompt('Repita a nova senha:'); if(s2===null) return;
    if (s1 !== s2) { toast('As senhas não conferem', true); return; }
    const u = await criarUsuario(SESSAO.nome, s1, ACCESS_KEY);
    SESSAO = { id:u.id, nome:u.nome, key:u.key };
    await lsSave();
    toast('Senha alterada');
  };
  document.querySelectorAll('[data-delu]').forEach(x=>x.onclick=async()=>{
    const id = x.dataset.delu;
    if (id === SESSAO.id) { toast('Você não pode remover o próprio acesso aqui — use "Sair"', true); return; }
    const u = authUsuarios().find(y=>y.id===id);
    if (!confirm('Remover o acesso de ' + (u?u.nome:id) + ' neste aparelho?\n\nEle deixa de conseguir entrar aqui. Nos outros aparelhos nada muda.')) return;
    const a = authLer(); a.usuarios = a.usuarios.filter(y=>y.id!==id); authGravar(a);
    toast('Acesso removido'); renderConfig();
  });
  $('#cfg_chave_salvar').onclick=()=>{
    setAccessKey($('#cfg_chave').value);
    toast('Chave salva — recarregando');
    setTimeout(()=>location.reload(), 700);
  };
  $('#cfg_chave_ver').onclick=()=>{
    const el=$('#cfg_chave'); el.type = el.type==='password' ? 'text' : 'password';
  };
  $('#cfg_chave_sair').onclick=()=>{
    if(!confirm('Apagar a chave deste aparelho? Ele deixa de acessar o Sheets até você colar a chave de novo.\n\nOs dados salvos neste dispositivo continuam aqui.')) return;
    setAccessKey('');
    location.reload();
  };
  $('#cfg_save').onclick=()=>{
    SHEET_URL=$('#cfg_url').value.trim();
    localStorage.setItem('sheetUrl', SHEET_URL);
    toast('URL salva');
  };
  $('#cfg_test').onclick=async()=>{
    SHEET_URL=$('#cfg_url').value.trim();
    $('#cfg_result').textContent='Testando...';
    try{
      const r=await fetch(SHEET_URL+'?action=ping');
      const j=await r.json();
      $('#cfg_result').innerHTML=j.ok
        ?'<span style="color:var(--green)">✅ Conexão OK!'+(j.protegido===false?' <b style="color:var(--gold)">— mas SEM chave de acesso</b>':'')+'</span>'
        :'<span style="color:var(--red)">❌ Erro: '+j.error+'</span>';
      if(j.ok){setSyncStatus('ok','Conectado');await sheetLoad();render();}
    }catch(e){
      $('#cfg_result').innerHTML='<span style="color:var(--red)">❌ Não conseguiu conectar.</span>';
      setSyncStatus('err');
    }
  };
  $('#cfg_export').onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='comanda-backup-'+hojeStr()+'.json';
    a.click();
    toast('Backup baixado');
  };
  $('#cfg_restore').onclick=mostrarBackups;
}

// ============================================================
//  BOOT — ordem de segurança:
//  1) localStorage (instantâneo, nunca some)
//  2) Google Sheets com MESCLAGEM (traz o que outros dispositivos salvaram)
//  3) seed só se estiver absolutamente tudo vazio
// ============================================================
async function iniciarSessao(){
  document.getElementById('appwrap').style.visibility = 'visible';
  armarTrava();
  const temLocal = await lsLoad();
  if (temLocal) { render(); setSyncStatus('loading', 'Dados locais carregados — sincronizando...'); }
  if (SHEET_URL) {
    const ok = await sheetLoad();
    if (ok) {
      const temDados = KEYS.some(k => S[k] && S[k].length > 0);
      if (!temDados && !temLocal) seed();
    } else if (!temLocal) {
      setSyncStatus('err', 'Offline — sem dados locais ainda');
    }
  } else if (!temLocal) {
    seed();
    setSyncStatus('none', 'Configure em ⚙️');
  }
  render();
  await lsSave();   // regrava cifrado (migra o formato antigo em texto puro)
}

(async function(){
  mostrarTrava();
  // Auto-sync a cada 2 minutos — nunca durante digitação/edição,
  // e sempre com mesclagem (não sobrescreve nada)
  setInterval(async()=>{
    const digitando = document.activeElement && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
    const emEdicao = ['fechamento','retiradas','metas'].includes(tab);
    if (LOGADO() && SHEET_URL && !emEdicao && !editandoId && !digitando && syncStatus !== 'loading') {
      const ok = await sheetLoad();
      if (ok) render();
    }
  }, 120000);
})();
</script>
